name: CI

# Runs on every pull request. Pushes to main run it through the Deploy workflow, so it is not repeated here.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- apps/api/drizzle || (echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit apps/api/drizzle." && exit 1)

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web and bundle the Worker
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://localhost:8787' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3000' }}
