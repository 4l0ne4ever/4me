name: Deploy

# main -> CI -> database migrations -> API (Cloudflare Workers) -> web (Vercel)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Migrate database
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to Neon
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  api:
    name: Deploy API to Cloudflare Workers
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          wranglerVersion: "4.147.0"
          # Uploaded as Worker secrets on every deploy. Optional ones (TURNSTILE_SECRET, LASTFM_API_KEY)
          # are set once with `wrangler secret put` so an empty value never overwrites them.
          secrets: |
            DATABASE_URL
            ADMIN_TOKEN
            IP_SALT
          command: deploy --var WEB_ORIGIN:${{ vars.SITE_URL }} --var LASTFM_USER:${{ vars.LASTFM_USER }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          IP_SALT: ${{ secrets.IP_SALT }}
      - name: Smoke test
        if: vars.API_URL != ''
        # A brand-new workers.dev route can answer 404 for a minute, so every error is retried.
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.API_URL }}/health"

  web:
    name: Deploy web to Vercel
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel settings and env
        run: pnpm dlx vercel@62.2.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: pnpm dlx vercel@62.2.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: pnpm dlx vercel@62.2.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
